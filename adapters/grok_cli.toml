schema_version = 1
id = "grok_cli"
observed_version = "1.0.5"
models = ["grok-4.6"]
skill = "skills/adapters/grok_cli/SKILL.md"

[executable]
candidates = ["grok"]
version_argv = ["grok", "--version"]

[launch]
argv = ["grok", "--model", "{model}", "--session-id", "{native_session_id}"]

[resume]
supported = true
argv = ["grok", "--model", "{model}", "--resume", "{native_session_id}"]

[session_capture]
kind = "generated_uuid"

[startup]
argv = ["Read {bootstrap_path}, its sibling FOIL.md, and the role_path recorded in bootstrap.json before beginning."]

[permissions]
auto = ["--always-approve"]
