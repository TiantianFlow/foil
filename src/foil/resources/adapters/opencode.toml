schema_version = 1
id = "opencode"
observed_version = "1.18.21"
models = ["xai/grok-4.6"]
skill = "skills/adapters/opencode/SKILL.md"

[executable]
candidates = ["opencode"]
version_argv = ["opencode", "--version"]

[launch]
argv = ["opencode", ".", "--model", "{model}"]

[resume]
supported = true
argv = ["opencode", ".", "--model", "{model}", "--session", "{native_session_id}"]

[session_capture]
kind = "command_json_list_delta"
argv = ["opencode", "session", "list", "--format", "json"]
id_pointer = "/id"
cwd_pointer = "/directory"

[startup]
argv = ["Read {bootstrap_path} before beginning."]

[permissions]
auto = ["--auto"]
