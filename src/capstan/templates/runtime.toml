# Two-seat walking skeleton consumed directly by launch/status/resume/stop.
schema_version = 1
fleet_id = "__FLEET_ID__"
display_name = "Starter runtime"
adapter_paths = []

[[usage_pools]]
id = "primary"
adapter = "grok_cli"
model = "grok-4.6"

[[usage_pools]]
id = "independent-review"
adapter = "opencode"
model = "xai/grok-4.6"

[[seats]]
