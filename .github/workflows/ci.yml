name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Test
        run: uv run --isolated --extra dev pytest
      - name: Lint
        run: uv run --isolated --extra dev ruff check .
      - name: Build
        run: uv build
