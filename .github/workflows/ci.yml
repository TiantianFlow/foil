name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Test
        run: uv run --no-config --frozen --isolated --extra dev pytest --ignore=tests/e2e
      - name: End-to-end user journeys
        run: uv run --no-config --frozen --isolated --extra dev pytest tests/e2e -m "not e2e_live"
      - name: Lint
        run: uv run --no-config --frozen --isolated --extra dev ruff check .
      - name: Build
        run: uv build --no-config
      - name: Smoke-test installed wheel
        run: |
          wheel_env="$RUNNER_TEMP/foil-wheel-smoke"
          uv venv --no-config "$wheel_env"
          uv pip install --no-config --python "$wheel_env/bin/python" dist/foil_orchestrator-*.whl
          version="$(uv run --no-config --frozen --isolated python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$("$wheel_env/bin/foil" --version)" = "foil $version"
