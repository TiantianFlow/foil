name: Release

# Publishes foil-orchestrator to PyPI when a vX.Y.Z tag is pushed. Run it by
# hand with a tag to publish a release that was tagged before this file existed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.6.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(uv run --no-config --frozen --isolated python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }
      - name: Build
        run: uv build --no-config
      - name: Smoke-test installed wheel
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          wheel_env="$RUNNER_TEMP/foil-wheel-smoke"
          uv venv --no-config "$wheel_env"
          uv pip install --no-config --python "$wheel_env/bin/python" dist/foil_orchestrator-*.whl
          test "$("$wheel_env/bin/foil" --version)" = "foil ${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this job's OIDC token, so no API token
    # is stored in the repository.
    environment:
      name: pypi
      url: https://pypi.org/project/foil-orchestrator/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
