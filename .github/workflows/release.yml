name: Release

# Publishes foil-ai to PyPI when a vX.Y.Z tag is pushed, and only after the
# CI workflow has succeeded for that commit. Run it by hand with a tag to
# retry a publish that failed. A manual run waits for CI the same way.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.6.1"
        required: true

permissions:
  contents: read

jobs:
  ci-green:
    name: Wait for CI
    runs-on: ubuntu-latest
    # Listing workflow runs needs actions: read. Job permissions replace the
    # workflow permissions, so contents: read is repeated for the checkout.
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.resolved.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - id: resolved
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait until CI succeeds for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolved.outputs.sha }}
        run: python3 .github/workflows/wait_for_ci.py

  build:
    name: Build
    needs: ci-green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - name: Build the commit CI approved
        run: test "$(git rev-parse HEAD)" = "${{ needs.ci-green.outputs.sha }}"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          # A release build starts from no cache, so nothing cached elsewhere reaches it.
          enable-cache: false
      - name: Check the tag matches the package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(uv run --no-config --frozen --isolated python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }
      - name: Build
        run: uv build --no-config
      - name: Smoke-test installed wheel
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          wheel_env="$RUNNER_TEMP/foil-wheel-smoke"
          uv venv --no-config "$wheel_env"
          uv pip install --no-config --python "$wheel_env/bin/python" dist/foil_ai-*.whl
          test "$("$wheel_env/bin/foil" --version)" = "foil ${TAG#v}"
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this job's OIDC token, so no API token
    # is stored in the repository.
    environment:
      name: pypi
      url: https://pypi.org/project/foil-ai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
