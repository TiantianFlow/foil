schema_version = 1
id = "pi-interactive"
cli = "pi"

[executable]
candidates = ["pi"]

# Keep Pi interactive. Its `-p` flag is one-shot print mode and therefore
# belongs only in an explicitly batch-oriented profile.
[launch]
argv = ["pi", "{working_directory}"]

[startup]
argv = ["Read {bootstrap_path}, its sibling FOIL.md, and the role_path recorded in bootstrap.json before beginning."]

[session_capture]
kind = "generated_uuid"

[environment]
forward = ["PI_API_KEY"]
